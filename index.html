<!DOCTYPE html>
<html>
    <head>
        <title>My Photography</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="photo-style.css">
    </head>
    <body>
        <header>
            <div class="header-overlay"></div>
            <div class="header-text">
                <h1>Sai Sree</h1>
                <p class="tagline">Preserving the honest emotion of your most cherished chapters.</p>
            </div>
        </header>
        <main class="gallery">
            <img src="images/thumbs/photo1.jpg" data-full="images/fulls/photo1.jpg" alt="My photo 1">
            <img src="images/thumbs/photo2.jpg" data-full="images/fulls/photo2.jpg" alt="My photo 2">
            <img src="images/thumbs/photo3.jpg" data-full="images/fulls/photo3.jpg" alt="My photo 3">
            <img src="images/thumbs/photo4.jpg" data-full="images/fulls/photo4.jpg" alt="My photo 4">
            <img src="images/thumbs/photo5.jpg" data-full="images/fulls/photo5.jpg" alt="My photo 5">
            <img src="images/thumbs/photo6.jpg" data-full="images/fulls/photo6.jpg" alt="My photo 6">
            <img src="images/thumbs/photo7.jpg" data-full="images/fulls/photo7.jpg" alt="My photo 7">
            <img src="images/thumbs/photo8.jpg" data-full="images/fulls/photo8.jpg" alt="My photo 8">
            <img src="images/thumbs/photo9.jpg" data-full="images/fulls/photo9.jpg" alt="My photo 9">
            <img src="images/thumbs/photo10.jpg" data-full="images/fulls/photo10.jpg" alt="My photo 10">
            <img src="images/thumbs/photo11.jpg" data-full="images/fulls/photo11.jpg" alt="My photo 11">
            <img src="images/thumbs/photo12.jpg" data-full="images/fulls/photo12.jpg" alt="My photo 12">
        </main>

        <section class="about">
            <div class="about-card">
            <h2>About</h2>
            <p>Your moments. Your story. My perspective.</p>
            <div class="socials">
                <a href="https://instagram.com/yourhandle" target="_blank">Instagram</a>
                <a href="https://www.facebook.com" target="_blank">Facebook</a>
                <a href="https://www.twitter.com" target="_blank">Twitter</a>
            </div>
        </div>
        </section>

        <div class="lightbox" id="lightbox">
            <span class="lightbox-close" id="lightboxClose">&times;</span>
            <span class="lightbox-prev" id="lightboxprev">&#10094;</span>
            <img src="" id="lightboxImg" alt="Enlarged photo">
            <span class="lightbox-next" id="lightboxNext">&#10095;</span>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
